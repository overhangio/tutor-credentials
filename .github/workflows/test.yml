name: Run tests

on:
  pull_request:
    branches: [ release, main ]
  push:
    branches: [ release, main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
         python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version:  ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          # On main this plugin requires the upcoming Tutor major version, which
          # has no PyPI release yet: install Tutor from its main branch first. The
          # sibling plugins come from their main branches too, with --no-deps, so
          # that their own Tutor pin cannot pull a released Tutor back over it.
          if [ "$TARGET_BRANCH" = "main" ]; then
            pip install "tutor[dev] @ git+https://github.com/overhangio/tutor@main"
            pip install --no-deps "tutor-discovery @ git+https://github.com/overhangio/tutor-discovery@main"
            pip install --no-deps "tutor-mfe @ git+https://github.com/overhangio/tutor-mfe@main"
          fi
          pip install .[dev]
      - name: Test lint, types, and format
        run: make test
